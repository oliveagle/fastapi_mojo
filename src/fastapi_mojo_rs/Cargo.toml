# fastapi_mojo_rs — Rust bridge for fastapi_mojo (ADR-0010 / decision-19)
#
# 终态: Mojo + Rust only. 本 crate 是 bridge 层 (替代 http_bridge_final.c /
# ws.c / runtime_shim.c), 以 staticlib + C ABI 形态静态链接进 single binary。
#
# 工程约束 (ADR-0010 §3, §6):
#   - crate-type = ["staticlib"]  (只产 .a, 绝不 cdylib)
#   - panic = "abort"             (panic 不跨界 unwind)
#   - lto = true, codegen-units = 1, opt-level = "z"  (体积/速度平衡)
#   - 第三方 crate 仅限纯 Rust 组合: flate2 (GZip 决策-40) + miniz_oxide
#     (RFC7692 决策-59) + rustls/rustls-rustcrypto (TLS 决策-64)。全部静态链接;
#     ldd 仅 libc 实测; 无 C/asm 路径; 其余 SHA-1/base64/UTF-8/syscall 手写。

[package]
name = "fastapi_mojo_rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "Rust bridge layer for fastapi_mojo single binary (Mojo + Rust only)"
license = "MIT"

[lib]
name = "fastapi_mojo_rs"
crate-type = ["staticlib"]

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"


[dependencies]
flate2 = "1.0"
# RFC 7692 uses the same pure-Rust miniz_oxide backend already linked by flate2.
miniz_oxide = "0.8"
# TLS/HTTPS: rustls core + RustCrypto pure-Rust provider (no ring/aws-lc C/asm).
rustls = { version = "=0.23.42", default-features = false, features = ["std"] }
rustls-rustcrypto = { version = "=0.0.2-alpha", default-features = false, features = ["std", "zeroize"] }
