# fastapi_mojo — CI：守护 North Star（单一 Binary 零依赖）
#
# 本工作流是「单一 binary 零运行期依赖」这一项目本标的自动化门禁：
#   1. 构建单一 binary（./build_single.sh）
#   2. ldd 断言：仅 libc + 内核组件（禁 libstdc++/libgcc_s/libm/Python/运行时 .so）
#   3. 干净环境（env -i）启动断言：无 Python / 无 LD_LIBRARY_PATH 即可服务
#   4. 单元测试（各 .mojo 自检）
#   5. e2e 集成测试（scripts/e2e_test.sh，79 项检查含 WebSocket（含 ADR-0007 增强 / ADR-0008 并发 / ADR-0009 精化），CI 可重复）
#
# 依赖：mojo 1.0.0（pip install modular）、gcc、binutils、curl
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支只保留最新一次 CI；取消被取代的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-binary:
    name: Build single binary + verify deps + unit + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fastapi/ 是 bootstrap 时代的源码参考 submodule，非运行期依赖，不检出
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ binutils curl

      - name: Install Mojo (modular)
        run: |
          python -m pip install --upgrade pip
          python -m pip install modular

      # Rust toolchain (ADR-0010, decision-19). 仓库 pin 在
      # src/fastapi_mojo_rs/rust-toolchain.toml (channel 1.97.1).
      - name: Install Rust toolchain (rustup, pinned)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show active-toolchain || true

      - name: Verify toolchain
        run: |
          set -e
          mojo --version
          gcc --version | head -1
          objcopy --version | head -1
          curl --version | head -1
          cargo --version
          rustc --version
          python -c "import modular, os; print('modular lib:', os.path.join(os.path.dirname(modular.__file__), 'lib'))"

      # 确定性地导出 MODULAR_LIB，供 build_single.sh 使用（其自动定位的兜底之外的首选）
      - name: Export MODULAR_LIB
        run: |
          MODLIB="$(python -c 'import modular, os; print(os.path.join(os.path.dirname(modular.__file__), "lib"))')"
          echo "MODULAR_LIB=$MODLIB" >> "$GITHUB_ENV"
          ls -1 "$MODLIB"

      - name: Build single binary
        run: ./build_single.sh

      # North Star 门禁：单一 binary 仅依赖 libc + 内核组件
      # (Rust staticlib 经 -static-libgcc 后不会引入 libgcc_s.so.1 — 见 build_single.sh)
      - name: Verify North Star — no forbidden runtime deps (ldd)
        run: |
          set -e
          out="$(ldd build/fastapi_mojo)"
          echo "$out"
          if echo "$out" | grep -Eiq 'libstdc\+\+|libgcc_s|libm\.so|python|KGEN|MSupport|AsyncRT|modular'; then
            echo "FAIL: 检测到禁止的运行期依赖（违反 AGENTS.md §1 零依赖本标）"
            exit 1
          fi
          echo "$out" | grep -q 'libc\.so' || { echo "FAIL: libc 缺失（异常）"; exit 1; }
          echo "PASS: 单一 binary 仅依赖 libc + 内核组件（vdso/ld-linux）"

      # 体积预算 (ADR-0010): C 基线 2.2M; Rust bridge 中间态引入 std 运行时,
      # 中间态上限 6MB; Phase 6 去 std (task #12) 后收紧到 C + 2MB (终态 <= 4.2M).
      - name: Track C — binary size budget
        run: |
          set -e
          SZ=$(stat -c%s build/fastapi_mojo)
          echo "binary size: $SZ bytes ($((SZ/1024/1024)) MB)"
          if [[ "$SZ" -gt $((6*1024*1024)) ]]; then
            echo "FAIL: 中间态体积 > 6MB (需去 std 收口, ADR-0010 task #12)"
            exit 1
          fi
          echo "PASS: 中间态体积 <= 6MB"

      # Track C 终态门禁: `find src -name '*.c'` 必须 = 0 (Mojo + Rust only, 决策-19).
      # 历史: ws.c (DC1 ✅) / http_bridge_final.c (DC2-h ✅) / runtime_shim.c (DC3 ✅) 已全迁 Rust.
      - name: "Track C — count remaining .c bridge files (终态期望: 0)"
        run: |
          set -e
          N=$(find src -name '*.c' | wc -l)
          echo "remaining .c files in src/: $N"
          if [[ "$N" == "0" ]]; then
            echo "PASS: 终态 Mojo + Rust only — C 清零达成 (决策-19)"
          else
            echo "FAIL: 仍有 $N 份 .c 桥接文件 (违反决策-19 / Track C 终态)"
            find src -name '*.c'
            exit 1
          fi

      # North Star 门禁：干净环境（env -i）直接起服务 — 无 Python、无 LD_LIBRARY_PATH
      - name: Verify clean-env startup (env -i)
        run: |
          set -e
          BIN="$(pwd)/build/fastapi_mojo"
          PORT=8765
          env -i "$BIN" --port "$PORT" > /tmp/clean_env.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -s -m 2 "http://127.0.0.1:$PORT/health" | grep -q '"status": "healthy"'; then
              ok=1; break
            fi
            sleep 0.5
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          if [[ "$ok" != "1" ]]; then
            echo "FAIL: 干净环境（env -i）启动未响应"
            cat /tmp/clean_env.log
            exit 1
          fi
          echo "PASS: env -i 干净环境直接起服务（零 Python / 零 LD_LIBRARY_PATH）"

      - name: Run unit tests
        run: |
          set -e
          cd src/fastapi_mojo
          for f in json params_query params_json router string_builder test_all; do
            echo "=== mojo run $f.mojo ==="
            mojo run "$f.mojo"
          done
          echo "PASS: all unit tests (Mojo)"

      # ADR-0010: Rust bridge 单元测试. env 变体测试 (state_tests) 与 fork/signal
      # 测试有全局副作用, 统一 --test-threads=1 保证可复现; #[ignore] fork/signal
      # 集成测试单独跑 (CI 上 fork 子进程可能受限, 用 --ignored 也允许失败).
      - name: Run Rust bridge unit tests (cargo, deterministic)
        # timeout 300 兜底防 Mutex 自死锁 / 任意 hang（实测 ws_protocol_round_trip
        # 修复前 full suite 永远 hang 280s+；实测修复后 0.22s 通过）。
        run: |
          set -e
          cd src/fastapi_mojo_rs
          timeout 300 cargo test --release -- --test-threads=1
          echo "PASS: cargo test --release green (single-threaded, <=300s)"

      - name: Run e2e suite (79 checks incl. WebSocket enhancements/concurrency/refinements, CI-repeatable)
        run: ./scripts/e2e_test.sh
